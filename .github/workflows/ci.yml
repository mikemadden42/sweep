name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # No version given: uses minimum_zig_version from build.zig.zon.
      - uses: mlugg/setup-zig@v2
      - name: Check formatting
        if: runner.os == 'Linux'
        run: zig fmt --check .
      - run: zig build
      - run: zig build test --summary all
      - run: zig build test --release=safe --summary all

  zig-nightly:
    # Early warning for breaking changes to std.process.Init and std.Io.
    # Allowed to fail so it never blocks a merge.
    name: Test (Zig nightly)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: master
      - run: zig build
      - run: zig build test --summary all
